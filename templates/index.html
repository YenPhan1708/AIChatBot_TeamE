<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bravur AI Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            text-align: center;
            margin: 50px;
        }

        .chat-container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.2);
        }

        .chat-box {
            width: 100%;
            height: 350px;
            overflow-y: auto;
            padding: 10px;
            border-radius: 10px;
            background: #ffffff;
            border: 1px solid #ddd;
            text-align: left;
        }

        /* chat bubbles */
        .message {
            display: block;
            padding: 10px;
            border-radius: 8px;
            margin: 5px 0;
            max-width: 80%;
            word-wrap: break-word;
        }

        .user-message {
            background: #007bff;
            color: white;
            align-self: flex-end;
            text-align: right;
            float: right;
            clear: both;
        }

        .bot-message {
            background: #e9ecef;
            color: black;
            align-self: flex-start;
            text-align: left;
            float: left;
            clear: both;
        }

        /* input and button */
        .input-container {
            display: flex;
            margin-top: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
        }

        button:hover {
            background: #0056b3;
        }

        /* loading spinner */
        .spinner {
            display: none;
            margin: 10px auto;
            border: 4px solid #ddd;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            clear: both;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<h1>Bravur AI Chatbot</h1>
<div class="chat-container">
    <div id="chat-box" class="chat-box"></div>
    <div class="spinner" id="spinner"></div> <!-- loading animation -->
    <div class="input-container">
        <input type="text" id="user-input" placeholder="Type your question...">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    function sendMessage() {
        let userInputField = document.getElementById("user-input");
        let userInput = userInputField.value.trim();
        if (userInput === "") return;

        let chatBox = document.getElementById("chat-box");
        let spinner = document.getElementById("spinner");

        // add user's message
        chatBox.innerHTML += `<p class="message user-message">${userInput}</p>`;
        userInputField.value = ""; // clear input field
        spinner.style.display = "block"; // show loading animation

        fetch("/chat", {
            method: "POST",
            body: new URLSearchParams({ "user_input": userInput }),
            headers: { "Content-Type": "application/x-www-form-urlencoded" }
        })
            .then(response => response.json())
            .then(data => {
                spinner.style.display = "none"; // hide loading animation
                chatBox.innerHTML += `<p class="message bot-message">${data.response}</p>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            })
            .catch(error => {
                console.error("Error:", error);
                spinner.style.display = "none";
                chatBox.innerHTML += `<p class="message bot-message">Something went wrong. Try again!</p>`;
            });
    }

    // enter key to send messages
    document.getElementById("user-input").addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            sendMessage();
        }
    });
</script>
</body>
</html>
